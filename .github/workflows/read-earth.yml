name: Red Earth CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Find React project
        shell: bash
        run: |
          PACKAGE_FILE=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "Error: package.json was not found."
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE_FILE")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "React project found in: $APP_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.APP_DIR }}

      - name: Run linting
        run: npm run lint --if-present
        working-directory: ${{ env.APP_DIR }}

      - name: Build React application
        run: npm run build
        working-directory: ${{ env.APP_DIR }}

      - name: Build successful
        run: echo "Red Earth application built successfully!"